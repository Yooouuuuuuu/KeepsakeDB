[project]
name = "keepsakedb"
version = "0.1.2"
description = "A lightweight hybrid (dense + BM25) memory store for AI companions and agents, on a single SQLite file."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]            # L1: sqlite-vec vec0 index instead of the numpy matrix
jieba = ["jieba>=0.42"]                # L1: word tokenizer for zh (default is CJK bigram, no deps)
llama = ["llama-cpp-python>=0.3.0"]    # embedder: in-process GGUF (default is OpenAI-compatible HTTP)
pipeline = ["httpx>=0.27"]             # L2: LLM client
bench = ["milvus-lite>=3.2", "pymilvus>=2.6", "rank-bm25>=0.2", "jieba>=0.42", "httpx>=0.27", "sqlite-vec>=0.1.6"]
dev = ["pytest>=8"]

[project.scripts]
keepsake = "keepsakedb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["keepsakedb*"]
